allowBuilds:
  esbuild@0.28.1: true
  sharp@0.35.3: true
  unrs-resolver@1.12.2: true
  workerd@1.20260515.1: true

# Supply-chain controls: reject unreviewed install scripts and avoid packages
# before the ecosystem has had time to identify and remove malicious releases.
strictDepBuilds: true
verifyDepsBeforeRun: error
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustLockfile: false

# Force the patched native image library across build-time tooling whose range
# has not yet adopted Sharp's patched 0.35 release.
overrides:
  sharp: 0.35.3
  esbuild: 0.28.1
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  undici: 7.29.0
  ws: 8.21.0

# Keep native dependencies available for both Apple Silicon and Intel/Rosetta
# Node installations. "current" preserves support for non-macOS development.
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - arm64
    - x64
